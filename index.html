<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Davka Travel - Admin Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        davka: {
                            bg: '#00040f',      
                            surface: '#0b1221', 
                            navy: '#0f172a',    
                            orange: '#ff5400',  
                            accent: '#0ea5e9',  
                            glass: 'rgba(15, 23, 42, 0.7)',
                            border: 'rgba(255, 255, 255, 0.08)'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'], 
                        serif: ['Cinzel', 'serif'],
                        mono: ['Courier Prime', 'monospace'],
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(255, 84, 0, 0.3)',
                        'glow': '0 0 20px rgba(14, 165, 233, 0.2)'
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-davka-bg text-white min-h-screen relative pb-32 overflow-x-hidden selection:bg-davka-orange selection:text-white">

    <div id="splash-screen" class="fixed inset-0 z-[10000] flex items-center justify-center bg-black overflow-hidden splash-transition">
        <video id="intro-video" class="absolute inset-0 w-full h-full object-contain z-10" playsinline muted autoplay>
            <source src="intro.mp4" type="video/mp4">
            Browser Anda tidak mendukung video tag.
        </video>
        
        <div class="absolute inset-0 bg-gradient-to-t from-davka-bg via-transparent to-transparent opacity-0 z-20" id="video-overlay"></div>
        
        <div id="post-video-loader" class="video-loader-wrapper">
            <div class="video-loader-track">
                <div id="post-video-fill" class="video-loader-fill"></div>
            </div>
            <p class="video-loader-text">INITIALIZING SYSTEM...</p>
        </div>

        <button id="btn-skip-intro" class="absolute bottom-10 right-6 z-[60] text-[10px] font-bold text-white/50 border border-white/20 px-4 py-2 rounded-full uppercase tracking-widest hover:bg-white/10 hover:text-white transition-all backdrop-blur-md hidden">
            SKIP <i class="fas fa-forward ml-2"></i>
        </button>
    </div>
    
    <div id="global-loader" class="loading-overlay hidden">
        <div class="relative w-16 h-16 mb-6 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-davka-orange via-davka-accent to-davka-orange blur-md animate-spin-slow opacity-70"></div>
            <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-davka-orange via-davka-accent to-transparent animate-spin-slow"></div>
            <div class="absolute inset-[3px] bg-davka-bg rounded-full z-10"></div>
            
            <div class="absolute inset-0 z-20 flex items-center justify-center">
                <span class="font-serif font-bold text-2xl text-transparent bg-clip-text bg-gradient-to-br from-white to-gray-400 drop-shadow-lg">D</span>
            </div>
            
            <div class="absolute inset-[-10px] border border-white/5 rounded-full animate-ping-slow opacity-20"></div>
        </div>
        
        <p class="text-white/80 text-[10px] font-bold tracking-[0.3em] animate-pulse font-sans">
            MEMPROSES DATA
        </p>
    </div>

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[10%] right-[-10%] w-[50%] h-[50%] bg-davka-orange/10 rounded-full blur-[120px]"></div>
    </div>

    <header class="header-hero z-0 bg-davka-surface transition-all duration-500 ease-in-out">
        <img src="header.png" crossorigin="anonymous" alt="Header Background" class="absolute inset-0 w-full h-full opacity-80">
        <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-davka-bg/90"></div>
    </header>

    <div id="header-spacer" class="hidden"></div>

    <main id="app-content" class="px-5 w-full max-w-md mx-auto -mt-24 relative z-30">
        
        <section id="page-dashboard" class="fade-in space-y-4">
            
            <div class="pt-16 pb-2">
                
                <div class="flex flex-col justify-start items-start px-2 mb-6">
                    <h1 id="txt-greeting-time" class="text-2xl font-black text-white drop-shadow-lg leading-tight">
                        Selamat...
                    </h1>
                    <p class="text-sm font-bold text-davka-orange tracking-widest uppercase mt-1 drop-shadow-md">
                        Hai, Davka ganteng
                    </p>
                </div>

                <div class="flex justify-between items-center px-2 mb-4">
                    <div>
                        <span class="inline-block px-3 py-1 rounded-full bg-davka-orange/20 border border-davka-orange/50 text-[10px] text-davka-orange font-bold tracking-wider mb-1">
                            <i class="fas fa-crown mr-1"></i> PREMIUM ACCESS
                        </span>
                    </div>
                    <div class="text-right">
                        <div class="inline-block bg-black/40 backdrop-blur-md border border-white/10 px-3 py-1.5 rounded-xl shadow-lg">
                            <p class="text-[10px] text-white font-bold uppercase tracking-wider shadow-black drop-shadow-md" id="current-date">-</p>
                        </div>
                    </div>
                </div>

                <div class="glass p-5 rounded-3xl relative overflow-hidden mb-4 border border-white/10">
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-davka-orange rounded-full blur-3xl opacity-10"></div>
                    
                    <div class="relative z-10">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Total Omset</p>
                        <h2 class="text-3xl font-black text-white mb-3" id="stat-revenue">Rp 0</h2>
                        
                        <div class="inline-flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-lg border border-white/5">
                            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <p class="text-[10px] text-gray-300">
                                <span class="text-white font-bold text-sm mr-1" id="stat-today">0</span> 
                                Tiket Terjual
                            </p>
                        </div>
                    </div>
                </div>
                <div class="glass p-1 rounded-2xl flex justify-between items-center text-center shadow-lg">
                    <div class="flex-1 py-3 hover:bg-white/5 rounded-xl transition-colors">
                        <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">Pending</p>
                        <p class="text-lg font-bold text-yellow-500" id="stat-pending">0</p>
                    </div>
                    <div class="w-px h-8 bg-white/10"></div>
                    <div class="flex-1 py-3 hover:bg-white/5 rounded-xl transition-colors">
                        <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">Sukses</p>
                        <p class="text-lg font-bold text-green-500" id="stat-success">0</p>
                    </div>
                    <div class="w-px h-8 bg-white/10"></div>
                    <div class="flex-1 py-3 hover:bg-white/5 rounded-xl transition-colors">
                        <p class="text-[10px] text-gray-400 font-bold uppercase mb-1">Batal</p>
                        <p class="text-lg font-bold text-red-500" id="stat-cancel">0</p>
                    </div>
                </div>
            </div>
        </section>
        
        <section id="page-input" class="hidden fade-in pb-10 pt-4">
            <div class="flex justify-between items-center mb-6 mt-2">
                <div>
                    <h2 class="text-xl font-bold text-white">Form Pemesanan</h2>
                    <div class="h-1 w-10 bg-davka-orange rounded-full mt-1"></div>
                </div>
                <button onclick="resetForm()" class="text-[10px] font-bold text-davka-orange bg-davka-orange/10 px-3 py-2 rounded-full hover:bg-davka-orange hover:text-white transition-all flex items-center gap-2">
                    <i class="fas fa-sync-alt"></i> RESET FORM
                </button>
            </div>
            <form id="orderForm" class="space-y-5">
                <input type="hidden" id="editIndex" value="-1">
                
                <!-- DATA PEMESAN -->
                <div class="glass p-5 rounded-3xl space-y-4">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-blue-400">
                            <i class="fas fa-address-book text-xs"></i>
                        </div>
                        <h3 class="text-sm font-bold text-white">Data Pemesan</h3>
                    </div>

                    <div class="space-y-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-davka-orange uppercase tracking-wider pl-2 block">Nama Kontak</label>
                            <input type="text" id="inpContactName" required class="input-modern w-full outline-none" placeholder="Masukkan Nama Lengkap" autocapitalize="characters">
                        </div>
                        
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-davka-orange uppercase tracking-wider pl-2 block">WhatsApp (62..)</label>
                            <input type="tel" id="inpContactPhone" required class="input-modern w-full outline-none" placeholder="08xxxxxxxxxx">
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-davka-orange uppercase tracking-wider pl-2 block">Alamat Lengkap</label>
                            <textarea id="inpAddress" rows="2" class="input-modern w-full outline-none" placeholder="Nama Jalan, Kota..." autocapitalize="characters"></textarea>
                        </div>
                    </div>
                </div>

                <!-- DETAIL PERJALANAN -->
                <div class="glass p-5 rounded-3xl space-y-4">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-8 h-8 rounded-full bg-davka-orange/20 flex items-center justify-center text-davka-orange">
                            <i class="fas fa-train text-xs"></i>
                        </div>
                        <h3 class="text-sm font-bold text-white">Detail Perjalanan</h3>
                    </div>
                    
                    <div>
                        <select id="inpTripType" onchange="toggleTripType()" class="w-full bg-davka-bg border border-davka-border rounded-xl px-4 py-3 text-sm text-white focus:border-davka-orange outline-none">
                            <option value="one_way">Sekali Jalan</option>
                            <option value="round_trip">Pulang Pergi (PP)</option>
                        </select>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="flex-1">
                            <label class="text-[10px] text-gray-400 ml-1 mb-1 block">STASIUN ASAL (LENGKAP)</label>
                            <input type="text" id="inpOrigin" required class="w-full bg-davka-bg border border-davka-border rounded-xl px-4 py-3 text-lg font-bold text-white text-center uppercase focus:border-davka-orange outline-none" placeholder="Cth: GAMBIR" autocapitalize="characters">
                        </div>
                        <i class="fas fa-arrow-right text-gray-500 mt-5"></i>
                        <div class="flex-1">
                            <label class="text-[10px] text-gray-400 ml-1 mb-1 block">STASIUN TUJUAN (LENGKAP)</label>
                            <input type="text" id="inpDest" required class="w-full bg-davka-bg border border-davka-border rounded-xl px-4 py-3 text-lg font-bold text-white text-center uppercase focus:border-davka-orange outline-none" placeholder="Cth: TUGU" autocapitalize="characters">
                        </div>
                    </div>

                    <div class="bg-davka-bg/50 p-3 rounded-xl border border-white/5">
                        <label class="text-[10px] font-bold text-davka-orange block mb-2 tracking-widest">KEBERANGKATAN</label>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="text-[10px] text-gray-400">Tanggal</label>
                                <input type="date" id="inpDate" onchange="calcH45()" required class="w-full bg-davka-surface border border-davka-border rounded-lg p-2 text-xs text-white focus:border-davka-orange outline-none">
                            </div>
                            <div>
                                <label class="text-[10px] text-davka-orange font-bold">Beli Tiket</label>
                                <input type="date" id="inpWarDate" class="w-full bg-davka-surface border border-davka-orange/30 rounded-lg p-2 text-xs text-davka-orange font-bold outline-none" readonly>
                            </div>
                        </div>
                        <input type="text" id="inpTrain" required class="w-full bg-davka-surface border border-davka-border rounded-lg p-2.5 text-xs text-white focus:border-davka-orange outline-none" placeholder="Nama Kereta (Cth: Taksaka)" autocapitalize="characters">
                    </div>
                    
                    <div id="returnTripFields" class="hidden bg-davka-bg/50 p-3 rounded-xl border border-white/5 relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-500"></div>
                        <label class="text-[10px] font-bold text-blue-500 block mb-3 tracking-widest pl-2">KEPULANGAN (PP)</label>
                        
                        <div class="flex items-center gap-2 mb-3 pl-2">
                             <div class="flex-1">
                                <label class="text-[9px] text-gray-400 mb-1 block">ASAL (BALIK)</label>
                                <input type="text" id="inpReturnOrigin" class="w-full bg-davka-surface border border-davka-border rounded-lg p-2 text-sm font-bold text-white uppercase focus:border-blue-500 outline-none" placeholder="Cth: TUGU" autocapitalize="characters">
                            </div>
                            <i class="fas fa-arrow-right text-gray-600 text-[10px] mt-4"></i>
                            <div class="flex-1">
                                <label class="text-[9px] text-gray-400 mb-1 block">TUJUAN (BALIK)</label>
                                <input type="text" id="inpReturnDest" class="w-full bg-davka-surface border border-davka-border rounded-lg p-2 text-sm font-bold text-white uppercase focus:border-blue-500 outline-none" placeholder="Cth: GAMBIR" autocapitalize="characters">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 mb-3 pl-2">
                            <div>
                                <label class="text-[10px] text-gray-400">Tanggal Balik</label>
                                <input type="date" id="inpReturnDate" onchange="calcReturnH45()" class="w-full bg-davka-surface border border-davka-border rounded-lg p-2 text-xs text-white focus:border-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="text-[10px] text-blue-500 font-bold">Beli Tiket</label>
                                <input type="date" id="inpReturnWarDate" class="w-full bg-davka-surface border border-blue-500/30 rounded-lg p-2 text-xs text-blue-500 font-bold outline-none" readonly>
                            </div>
                        </div>
                        <input type="text" id="inpReturnTrain" class="w-full bg-davka-surface border border-davka-border rounded-lg p-2.5 text-xs text-white focus:border-blue-500 outline-none ml-2 w-[98%]" placeholder="Nama Kereta (Cth: Argo Lawu)" autocapitalize="characters">
                    </div>
                </div>

                <!-- PENUMPANG -->
                <div class="glass p-5 rounded-3xl space-y-4">
                    <div class="flex flex-col gap-3 border-b border-white/5 pb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center text-green-400">
                                <i class="fas fa-users text-xs"></i>
                            </div>
                            <h3 class="text-sm font-bold text-white">Penumpang</h3>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-davka-bg rounded-xl px-3 py-2 border border-davka-border flex justify-between items-center relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-1 bg-davka-orange"></div>
                                <span class="text-[10px] text-gray-400 uppercase font-bold pl-2">Dewasa</span>
                                <select id="inpPaxCount" onchange="updatePassengerForms()" class="bg-transparent text-white text-sm font-bold text-right focus:outline-none w-12 cursor-pointer appearance-none z-10">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                </select>
                                <i class="fas fa-chevron-down text-[8px] text-gray-500 absolute right-0 pointer-events-none"></i>
                            </div>
                            
                            <div class="bg-davka-bg rounded-xl px-3 py-2 border border-davka-border flex justify-between items-center relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-1 bg-pink-500"></div>
                                <span class="text-[10px] text-gray-400 uppercase font-bold pl-2">Bayi</span>
                                <select id="inpInfantCount" onchange="updatePassengerForms()" class="bg-transparent text-white text-sm font-bold text-right focus:outline-none w-12 cursor-pointer appearance-none z-10">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                                <i class="fas fa-chevron-down text-[8px] text-gray-500 absolute right-0 pointer-events-none"></i>
                            </div>
                        </div>
                    </div>

                    <!-- TOGGLE SWITCH PENUMPANG SAMA (Hanya muncul jika PP) -->
                    <div id="togglePaxReturnContainer" class="hidden flex items-center justify-between bg-davka-bg/50 p-3 rounded-xl border border-white/5 mt-2">
                        <label class="text-[10px] text-gray-300 font-bold uppercase tracking-wider">Data Penumpang Pulang<br><span class="text-davka-orange">Sama dengan Pergi?</span></label>
                        <label class="toggle-switch">
                            <input type="checkbox" id="inpPaxSame" checked onchange="togglePaxSame()">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    
                    <!-- KONTINER PENUMPANG PERGI -->
                    <div id="passengerFormsDepart" class="space-y-4"></div>

                    <!-- KONTINER PENUMPANG PULANG -->
                    <div id="passengerFormsReturnWrapper" class="hidden space-y-4 pt-4 border-t border-blue-500/30">
                        <h4 class="text-[10px] font-bold text-blue-500 uppercase tracking-widest pl-2"><i class="fas fa-users mr-1"></i> Penumpang Pulang</h4>
                        
                        <!-- INDIKATOR JUMLAH PENUMPANG PULANG -->
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div class="bg-blue-500/5 rounded-xl px-3 py-2 border border-blue-500/30 flex justify-between items-center relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-500"></div>
                                <span class="text-[10px] text-gray-400 uppercase font-bold pl-2">Dewasa</span>
                                <select id="inpReturnPaxCount" onchange="updatePassengerForms()" class="bg-transparent text-white text-sm font-bold text-right focus:outline-none w-12 cursor-pointer appearance-none z-10">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="6">6</option>
                                    <option value="7">7</option>
                                    <option value="8">8</option>
                                </select>
                                <i class="fas fa-chevron-down text-[8px] text-gray-500 absolute right-0 pointer-events-none"></i>
                            </div>
                            
                            <div class="bg-pink-500/5 rounded-xl px-3 py-2 border border-pink-500/30 flex justify-between items-center relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-1 bg-pink-500"></div>
                                <span class="text-[10px] text-gray-400 uppercase font-bold pl-2">Bayi</span>
                                <select id="inpReturnInfantCount" onchange="updatePassengerForms()" class="bg-transparent text-white text-sm font-bold text-right focus:outline-none w-12 cursor-pointer appearance-none z-10">
                                    <option value="0">0</option>
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                </select>
                                <i class="fas fa-chevron-down text-[8px] text-gray-500 absolute right-0 pointer-events-none"></i>
                            </div>
                        </div>

                        <div id="passengerFormsReturn" class="space-y-4"></div>
                    </div>

                </div>
